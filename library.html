<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllDebrid Library</title>
<link rel="stylesheet" href="library.css">
</head>
<body>
<header><div><h1>AllDebrid</h1><p>Your magnets and videos</p></div><div class="actions"><label class="theme-control">Theme <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="refresh">Refresh</button><button id="disconnect">Sign out</button></div></header>
<section id="auth"><h2>Connect your account</h2><p>Sign in using a PIN. No password needed here.</p><button id="connect">Sign in to AllDebrid</button><div id="pin" hidden><p>Code: <strong id="code"></strong></p><a id="pin-link" target="_blank" rel="noopener noreferrer">Confirm on AllDebrid ↗</a></div></section>
<div id="tools"><input id="search" type="search" placeholder="Search for a video or magnet…" aria-label="Search"><label><input id="ready-only" type="checkbox"> Ready only</label></div>
<section class="tmdb-settings" aria-label="TMDB settings">
<label for="tmdb-key">TMDB API key</label>
<input id="tmdb-key" type="password" autocomplete="off" placeholder="API key (v3)">
<button id="tmdb-save">Save</button>
<p id="tmdb-status" role="status"></p>
<small>The key is saved in plugin preferences. Movie titles and years are sent to TMDB.</small>
</section>
<p id="message" role="status" aria-live="polite"></p>
<p id="count"></p>
<main id="magnets"></main>
<footer><img src="https://image.tmdb.org/t/p/original/wwemzKWzjKYJFfCeiB57q3r4Bcm.svg" alt="TMDB" width="80"><p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p></footer>
<script src="library-ui.js"></script>
</body>
</html>
