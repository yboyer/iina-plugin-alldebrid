name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: '.node-version'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: |
          npx --yes --min-release-age=0 --package=semantic-release@26.0.1 --package=@yboyer/semantic-release-config@1.0.0 --package=@semantic-release/exec@7.1.0 -c '
            mkdir -p node_modules/@yboyer &&
            ln -s "$(dirname "$(command -v semantic-release)")/../@yboyer/semantic-release-config" node_modules/@yboyer/semantic-release-config &&
            semantic-release
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
